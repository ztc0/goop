version: 2
updates:
  - package-ecosystem: bun
    directory: /
    # main is the default branch but only accepts pull requests from dev.
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
